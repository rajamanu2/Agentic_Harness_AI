ServerRoot "C:/Users/rajam/OneDrive/Documents/New project/.runtime/apache-full/Apache24"
Listen 0.0.0.0:8088
ServerName 192.168.1.6:8088
PidFile "logs/agentica-httpd.pid"

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule alias_module modules/mod_alias.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so

TypesConfig conf/mime.types
DirectoryIndex index.html
ErrorLog "logs/agentica-error.log"
CustomLog "logs/agentica-access.log" common
LogLevel warn
DocumentRoot "C:/Users/rajam/OneDrive/Documents/New project/agentic-harness/dist"

<Directory "C:/Users/rajam/OneDrive/Documents/New project/agentic-harness/dist">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/artifacts/
    RewriteCond %{REQUEST_URI} !^/live-projects/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.html [L]
</Directory>

ProxyRequests Off
ProxyPreserveHost On
ProxyPass "/api/" "http://127.0.0.1:8797/api/"
ProxyPassReverse "/api/" "http://127.0.0.1:8797/api/"
ProxyPass "/artifacts/" "http://127.0.0.1:8797/artifacts/"
ProxyPassReverse "/artifacts/" "http://127.0.0.1:8797/artifacts/"
ProxyPass "/live-projects/" "http://127.0.0.1:8797/live-projects/"
ProxyPassReverse "/live-projects/" "http://127.0.0.1:8797/live-projects/"

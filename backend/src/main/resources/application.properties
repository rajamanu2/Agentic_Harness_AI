spring.application.name=salesforce-command-center
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:commandcenter;MODE=PostgreSQL;DATABASE_TO_UPPER=false}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.sql.init.mode=never

command-center.user-name=${COMMAND_CENTER_USER_NAME:Manu}
command-center.desktop-url=${DESKTOP_UI_URL:http://127.0.0.1:5173}
command-center.salesforce.org-alias=${SALESFORCE_ORG_ALIAS:dev-sandbox}
command-center.salesforce.login-url=${SALESFORCE_LOGIN_URL:https://test.salesforce.com}
command-center.codex.default-repo-path=${CODEX_DEFAULT_REPO_PATH:../salesforce}
command-center.scan.fixed-delay-ms=${ORG_SCAN_DELAY_MS:900000}
command-center.jira.base-url=${JIRA_BASE_URL:}
command-center.jira.email=${JIRA_EMAIL:}
command-center.jira.api-token=${JIRA_API_TOKEN:}
command-center.jira.project-key=${JIRA_PROJECT_KEY:SF}
command-center.github.default-remote=${GITHUB_REMOTE:origin}
command-center.ai.provider=${AI_PROVIDER:glm}
command-center.ai.model=${AI_MODEL:glm-5.1}
command-center.ai.base-url=${AI_BASE_URL:https://api.z.ai/api/paas/v4}
command-center.ai.api-key=${AI_API_KEY:}
command-center.harness.base-url=${HARNESS_BASE_URL:https://app.harness.io}
command-center.harness.api-key=${HARNESS_API_KEY:}
command-center.harness.account-identifier=${HARNESS_ACCOUNT_IDENTIFIER:}
command-center.harness.org-identifier=${HARNESS_ORG_IDENTIFIER:}
command-center.harness.project-identifier=${HARNESS_PROJECT_IDENTIFIER:}
command-center.harness.pipeline-identifier=${HARNESS_PIPELINE_IDENTIFIER:}
command-center.harness.trigger-url=${HARNESS_TRIGGER_URL:}

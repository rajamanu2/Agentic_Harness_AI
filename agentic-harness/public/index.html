<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Agentic Harness API</title>
    <style>
      body {
        background: #f5f7fb;
        color: #172033;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 2rem;
      }

      main {
        background: #ffffff;
        border: 1px solid #dbe5f0;
        border-radius: 8px;
        margin: 0 auto;
        max-width: 760px;
        padding: 1.25rem;
      }

      h1 {
        margin-top: 0;
      }

      code {
        background: #eef4fb;
        border-radius: 6px;
        padding: 0.12rem 0.3rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Universal Agentic Harness</h1>
      <p>The API is running. Start the Vite UI with <code>npm run dev</code>, or build the UI with <code>npm run build</code> and run <code>npm start</code>.</p>
      <p>Health: <a href="/api/health">/api/health</a></p>
    </main>
  </body>
</html>

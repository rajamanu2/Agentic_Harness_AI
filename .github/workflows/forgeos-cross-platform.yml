name: ForgeOS Cross-Platform Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agentic-harness/**"
      - "backend/**"
      - "forgeos-platform/**"
      - ".github/workflows/forgeos-cross-platform.yml"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            engine: forgeos-engine.exe
          - os: ubuntu-24.04
            platform: linux
            engine: forgeos-engine
          - os: macos-14
            platform: macos-arm64
            engine: forgeos-engine
    runs-on: ${{ matrix.os }}
    env:
      RUNTIME_ROOT: forgeos-platform/apps/examples/desktop-app/src-tauri/resources/forgeos-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"
          cache: maven

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Test and build universal engine
        working-directory: agentic-harness
        shell: pwsh
        run: |
          npm ci
          npm run test:adapters
          npm run build

      - name: Package control plane
        shell: pwsh
        run: |
          if ($IsWindows) { & .\backend\mvnw.cmd clean package }
          else { chmod +x ./backend/mvnw; & ./backend/mvnw clean package }

      - name: Create platform-native embedded services
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNTIME_ROOT/engine" | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNTIME_ROOT/control-plane" | Out-Null
          bun build agentic-harness/server.mjs --compile --outfile "$env:RUNTIME_ROOT/engine/${{ matrix.engine }}"
          Copy-Item agentic-harness/dist "$env:RUNTIME_ROOT/engine/dist" -Recurse -Force
          Copy-Item backend/target/salesforce-command-center-0.0.1-SNAPSHOT.jar "$env:RUNTIME_ROOT/control-plane/forgeos-control-plane.jar" -Force
          jlink --module-path "$env:JAVA_HOME/jmods" --add-modules ALL-MODULE-PATH --strip-debug --no-header-files --no-man-pages --compress zip-6 --output "$env:RUNTIME_ROOT/control-plane/jre-all"

      - name: Install monorepo dependencies
        working-directory: forgeos-platform
        run: bun install --frozen-lockfile

      - name: Validate native source
        working-directory: forgeos-platform/apps/examples/desktop-app/src-tauri
        run: |
          cargo fmt --check
          cargo check --release

      - name: Build native packages
        working-directory: forgeos-platform
        run: bun -F @forgeos/code build:binary

      - name: Collect packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          Get-ChildItem forgeos-platform/apps/examples/desktop-app/src-tauri/target -Recurse -File | Where-Object { $_.Extension -in '.msi','.exe','.dmg','.deb','.rpm','.AppImage' } | Copy-Item -Destination packages
          if (-not (Get-ChildItem packages -File -ErrorAction SilentlyContinue)) { throw "No native packages were produced." }
          Get-FileHash packages/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content packages/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: forgeos-${{ matrix.platform }}
          path: packages/
          if-no-files-found: error
